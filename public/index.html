<style>
  :root {

  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .hint { font-weight: 400; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--bg); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .check input { width: auto; }
  button, .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff; text-decoration: none; }
  button:hover, .btn:hover { filter: brightness(1.08); }

  .bd-l { font-weight: 600; }

  .bd-bar i { display: block; height: 100%; border-radius: 99px; }
  .bd-bar i.ok { background: var(--ok); } .bd-bar i.mid { background: var(--brand); } .bd-bar i.low { background: var(--warn); } .bd-bar i.bad { background: var(--bad); }
  .bd-v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

  .method summary { cursor: pointer; }

  .filled { outline: 2px solid var(--ok); background: var(--ok-bg); }
  .cv { border-style: dashed; border-width: 2px; }

  .steps { list-style: none; margin: 0; padding: 0; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .result { display: grid; grid-template-columns: 76px 1fr; gap: 16px; }

  .score::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--card); }
  .score span { position: relative; z-index: 1; }

  .req { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .star.on { background: var(--ok); }
  .edit { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .orig { font-weight: 600; }
  .opt { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 14px; }
  .opt input[type=radio], .opt input[type=checkbox] { width: auto; margin-top: 4px; }
  .opt > span { display: grid; gap: 4px; flex: 1; }
  .opttext { padding: 6px 10px; font-size: 14px; }
  .up { color: var(--ok); font-weight: 700; } .down { color: var(--bad); font-weight: 700; }
  .ba { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 14px 0 8px; }
  .ba > div { display: grid; } .ba b { font-size: 34px; line-height: 1.1; } .ba .arrow { font-size: 28px; color: var(--muted); }
  tr.changed td { background: var(--ok-bg); }
  .gapcard { padding: 12px 0; border-top: 1px solid var(--line); }

  .gapcard p { margin: 4px 0; font-size: 14px; }

  .divider { display: grid; gap: 2px; margin: 28px 0 12px; padding-top: 14px; border-top: 2px dashed var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } .result { grid-template-columns: 1fr; } nav { margin-left: 0; } }
