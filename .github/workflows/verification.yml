name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Security and end-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check dependency advisories
        run: bun audit
      - name: Check types
        run: bun run typecheck
      - name: Run unit and HTTP tests
        run: bun test
      - name: Install Chromium
        run: bun --bun e2e-web install chromium --with-deps
      - name: Run desktop browser tests
        run: bun run test:browser --retries 0 --no-cache
      - name: Run mobile viewport browser tests
        run: bun run test:browser --retries 0 --no-cache
        env:
          BEASISWA_TEST_MOBILE: '1'
