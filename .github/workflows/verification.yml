name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Security and end-to-end checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit
      - name: Run unit and HTTP tests
        run: npm test
      - name: Install Chromium
        run: npx --no-install e2e-web install chromium --with-deps
      - name: Run desktop browser tests
        run: npm run test:browser -- --retries 0 --no-cache
      - name: Run mobile viewport browser tests
        run: npm run test:browser -- --retries 0 --no-cache
        env:
          BEASISWA_TEST_MOBILE: '1'
